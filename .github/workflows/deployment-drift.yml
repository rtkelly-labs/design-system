# Is the production domain serving what the `production` branch builds?
#
# Production silently stopped updating. `Docs/CodeTabs` landed on 8 September and
# was still absent from the site three days and ~30 merged pull requests later,
# along with the whole Manifesto, `Swatch`, `Card` and `DataTable`. 136 stories
# served against 168 built, and nothing reported it.
#
# ## Why this is not a required check on pull requests
#
# Two reasons, and both are structural rather than preference.
#
# 1. **`vercel.json` deliberately does not build feature branches.** Its
#    `ignoreCommand` exits 1 (build) only for `main`, `production`, `preview`, `slot/N`, or a
#    commit message tagged `[deploy]`/`[preview]`/`[storybook]`; everything else
#    exits 0 (skip). A Vercel check made required would therefore never turn
#    green on an ordinary branch, and every pull request would block forever.
#
# 2. **A deployment happens after a merge.** On a pull request there is nothing
#    to compare: the deployed site cannot contain the commit under review. A gate
#    that can only be red is a gate that gets deleted.
#
# ## Why it compares against `production`, not `main`
#
# The domain serves the `production` branch, which only the release train moves.
# Compared against `main`, this was red after nearly every merge until the next
# train, truthfully but uselessly: "a train is due" is the train's own question,
# and a check that is red by design hides the red that is a fault. Compared
# against `production`, red means one thing: the site is not serving what the
# pointer says. That is a failed or stuck Vercel build, or the account quota.
#
# So it runs where the answer exists:
#
# - when a release train finishes, since the train may have just moved the
#   pointer. The train pushes `production` with `GITHUB_TOKEN`, and GitHub
#   starts no workflow from such a push, so `push: [production]` would never
#   fire. `workflow_run` does;
# - daily, to catch a deploy that fails later or a quota that runs out overnight.
#
# The quota is the usual cause and it is not a code problem: the failing Vercel
# checks read `build-rate-limit`, which looks nothing like a broken build. This
# workflow is what turns that from silence into a red mark someone owns.

name: Deployment Drift

on:
  workflow_run:
    workflows: [Release Train]
    types: [completed]
  schedule:
    # 07:00 UTC daily. A deploy that fails at 02:00 should not wait for someone
    # to merge something before anyone hears about it.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: deployment-drift
  cancel-in-progress: true

jobs:
  drift:
    name: deployment-drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    timeout-minutes: 10
    # A failed train moved nothing, so there is nothing new to check.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout the production pointer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: production

      # The repo's own composite, so the Node version, the pnpm version and the
      # cache strategy cannot drift from `ci.yml`.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the Storybook the pointer describes
        run: pnpm build-storybook

      # Vercel builds on its own schedule after the train moves the pointer. Give
      # it room before calling the difference drift rather than latency.
      - name: Wait for the deploy to land
        if: github.event_name == 'workflow_run'
        run: sleep 180

      - name: Compare the deployment with this build
        run: pnpm check:deployed --strict
