name: Storybook Walkthrough

# Captures every story in every theme and publishes Playwright's HTML report as
# a build artifact, with each story's three themes attached side by side.
#
# Deliberately a separate workflow from `ci.yml`, and deliberately not a gate:
# it asserts nothing about how things *should* look, it just makes what they do
# look like reviewable. Visual regression stays in `ci.yml` where it can block
# a merge.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A walkthrough for an outdated commit is noise — drop in-flight runs when the
# branch moves on.
concurrency:
  group: walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    name: Capture Screenshot Walkthrough
    runs-on: ubuntu-latest
    # See ci.yml — same reason. This workflow is not a gate, so a run of it
    # sitting on a hung install for six hours is pure waste.
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Playwright Browsers
        uses: ./.github/actions/install-playwright

      # The long pole of the whole PR, and the one that grows with the system:
      # every story adds four captures. `playwright.walkthrough.config.ts` runs
      # it at six workers for that reason — measured, see the note there.
      - name: Capture Walkthrough
        run: pnpm walkthrough

      - name: Upload Walkthrough Report
        id: upload
        # Ships a partial report when a story fails to render — the failure is
        # exactly what you would want to look at. Deliberately not `always()`:
        # that also fires on cancellation, when `Capture Walkthrough` was
        # skipped and there is no report at all, so `if-no-files-found: error`
        # turned every cancelled run into a *failing* step. This workflow
        # cancels its own in-flight runs by design (see `concurrency` above),
        # so that was a self-inflicted red mark on routine behaviour.
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-walkthrough-${{ github.event.pull_request.head.sha || github.sha }}
          path: walkthrough-report/
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Storybook Walkthrough"
            echo
            if [ -d walkthrough-report/data ]; then
              total=$(find walkthrough-report/data -type f -name '*.png' | wc -l)
              echo "Attached **${total}** screenshots (identical captures are deduplicated)."
            else
              echo "No screenshots were produced."
            fi
            echo
            echo "Download **storybook-walkthrough-${SHA}** below, unzip, and open"
            echo "\`index.html\` directly — it works from \`file://\`, no server needed."
            echo "Each test is one story; open it to see dark / dim / sketch together."
            if [ -n "${{ steps.upload.outputs.artifact-url }}" ]; then
              echo
              echo "[Artifact download](${{ steps.upload.outputs.artifact-url }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
