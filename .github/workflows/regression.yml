name: Full Regression

# The merge gate. `ci.yml` is the smoke suite every push gets; this is the full
# one, run when a pull request is labelled `ready-to-merge` and on every push to
# it while the label stays.
#
# It reports as a commit status named `regression`, not as a job, because a
# job cannot say "not yet". A job skipped by its `if:` reports Success, and
# GitHub lets a required check that reported Success merge — so a skipped
# gate is no gate. A `pending` status blocks the merge, reads yellow rather
# than red, and carries the reason in its description:
#
#   regression  Pending — add the `ready-to-merge` label to run full regression
#
# What "full" adds today is the whole accessibility matrix: every story at the
# narrow viewport, not only the components in `MOBILE_CASES`. That is the scan
# which caught `SwatchCompare` and `TokenTable` only on `main`, nine days after
# they merged. Everything else in `ci.yml` already runs in full on every PR.
#
# Commits pushed with `GITHUB_TOKEN` (the `/update-snapshots` baselines) start
# no workflow, so they get no status and the PR waits. Remove and re-add the
# label to run the gate on them.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# `STATUS_CONTEXT` by that name: `repo-governance check-names` reads it to know
# the required `regression` check exists, since a status has no job name.
env:
  LABEL: ready-to-merge
  STATUS_CONTEXT: regression

jobs:
  # Decides whether to run, and says so on the head commit. Every event gets
  # this, so a label added or removed is reflected at once. A label event for
  # some other label changes nothing and posts nothing.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if { [ "${ACTION}" = labeled ] || [ "${ACTION}" = unlabeled ]; } && [ "${EVENT_LABEL}" != "${LABEL}" ]; then
            echo "Label '${EVENT_LABEL}' does not affect the gate."
            echo "full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${HAS_LABEL}" = true ]; then
            description="Full regression running"
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            description="Add the ${LABEL} label to run full regression"
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending -f context="${STATUS_CONTEXT}" -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "${STATUS_CONTEXT}: pending — ${description}"

  # The whole of `ci.yml`, in full mode. One run per pull request at a time: a
  # new push supersedes the run for the commit nobody is looking at any more.
  # The group is job-level, so a label event that skips this job never enters
  # it and cannot cancel a run in progress.
  full:
    needs: gate
    if: needs.gate.outputs.full == 'true'
    concurrency:
      group: regression-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets: inherit

  report:
    name: report
    needs: [gate, full]
    if: always() && needs.gate.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.full.result }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "${RESULT}" in
            success) state=success; description="Full regression passed" ;;
            cancelled) state=pending; description="Superseded by a newer run" ;;
            *) state=failure; description="Full regression failed (${RESULT})" ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" -f context="${STATUS_CONTEXT}" -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "${STATUS_CONTEXT}: ${state} — ${description}"
