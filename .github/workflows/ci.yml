name: CI & Visual Regression Checks

on:
  push:
    branches:
      - main
  # Deliberately unfiltered. `branches: [main]` here filters on the PR's *base*,
  # so a pull request into anything else got no CI at all — not a failure, not a
  # pending check, nothing. A stacked PR showed only the Vercel comment check and
  # read as "nothing to run", which is the worst way for a gate to be absent.
  #
  # A pull request is a request to merge, and it should be gated wherever it is
  # aimed. The push trigger keeps its filter because that one is the post-merge
  # signal for the default branch specifically.
  pull_request:
  # Manual re-run, for the one case the two triggers above cannot cover: the
  # snapshot workflow commits baselines with `GITHUB_TOKEN`, and GitHub does not
  # start workflow runs from those pushes. The PR then holds its previous visual
  # result with no way to refresh it short of an empty commit. See AGENTS.md
  # rule 8. Dispatch requires this file on the default branch, so it helps the
  # next branch rather than the one that adds it.
  workflow_dispatch:

# Supersede an in-flight run when the branch moves on: a result for a commit
# nobody is looking at any more is holding a runner the next push needs.
# `storybook-walkthrough.yml` already did this and `ci.yml` did not.
#
# Keyed on the event as well as the ref so a `workflow_dispatch` — rule 8's
# manual re-run, the only way to refresh a bot-pushed baseline — is in its own
# group. It therefore neither cancels the push run nor gets cancelled by one,
# and `cancel-in-progress` is false for it, because a re-run someone asked for
# by hand should never be thrown away.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs in parallel, then one that reports their verdict.
#
# This was a single job of nineteen serial steps. Nothing in it needed to be
# serial: the gates read the tree, the visual suite needs only a built
# Storybook, and no step consumed a previous step's output except
# `check:visual-coverage`, which reads `storybook-static/index.json`. The cost
# was structural rather than a slow step — every gate added since has been
# appended to the same chain, so the wall clock only ever grew, and the fastest
# and most frequently-failing check in the repo (`lint`) reported after the
# browser install and the screenshot suite had also run.
#
# Split, the critical path is the visual job alone and the gates report in about
# half a minute. `check:api` took the headroom in `unit` beside `build`; there is
# roughly twenty seconds left there before that job becomes the critical path
# again, so the next gate needing a built `dist/` goes there and anything that
# reads only the tree goes in `gates`.
#
# Every job carries a `timeout-minutes` per AGENTS.md rule 9. Only `visual`
# installs a browser, so only its ceiling has to clear that step's retry budget;
# the other three are sized to their own work, which is the point of splitting
# them — a hung gate no longer waits out a browser-shaped timeout.
# Job names are lowercase, snake_case, and at most two words, drawn from the
# shared lexicon in `shared-utilities`' governance map (`ci`, `build`, `test`,
# `lint`, `visual`, `publish`, ...). The comment on `verify` below says why:
# a name that describes the work has to change when the work changes.
# `repo-governance check-names` warns on names that drift from this.
jobs:
  gates:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every `pnpm` step below is this package's. The workspace root holds
        # only the lockfile, the workflows and `vercel.json`; the gates, the
        # build and the suites all live in `packages/design-system`, and setting
        # this once per job keeps each step reading exactly as it did when the
        # package was the repository.
        working-directory: packages/design-system
    # ~30s of Node scripts and one eslint pass, no network past `pnpm install`.
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The squash commit inherits the PR title, and `release-train.mjs` reads
      # its version bump from that title — a non-conventional title merged on
      # an otherwise-green PR poisons the next stable release. It is a step in
      # `gates` rather than its own workflow because only jobs inside this
      # file can enter the `ci` aggregate's `needs` (rule 6): a required check
      # in a second workflow is an advisory check, and an advisory check gets
      # merged red. The title comes from the event payload, so this needs
      # neither an install nor an API token.
      - name: Conventional PR Title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Setup
        uses: ./.github/actions/setup

      # theme.css is generated from src/theme/levels.ts. This fails if the
      # committed CSS no longer matches the source, which is the only thing
      # keeping the TS and CSS halves of the ladder in step.
      #
      # It reads the tree as committed, so it must not share a job with
      # `pnpm build` — which regenerates theme.css as its first act. Being in a
      # separate job now makes that structural rather than a matter of step
      # ordering.
      - name: Theme Token Drift
        run: pnpm tokens:check

      # The same question for the DTCG export in `tokens/`, which ships in the
      # package and is read by design tools rather than by the build. It had a
      # staleness check from the day it was written and ran in no workflow at
      # all, so a stale export could be published with every check green.
      # `check:governance` below is what noticed, and is why it cannot recur.
      - name: Design Token Drift
        run: pnpm tokens:design:check

      # Every text-on-surface and border-on-surface pair, on every level.
      - name: Contrast Gate
        run: pnpm check:contrast

      # The same question one layer out: do the figures written in prose still
      # match the arithmetic? DESIGN.md claimed 440 contrast pairs against a gate
      # reporting 220 for four months, because nothing compared the two. Sits
      # next to `tokens:check` deliberately — both gate a copy of the source
      # against the source.
      - name: Documented figures
        run: pnpm check:docs

      # The other half of the same job: `check:docs` compares figures, this
      # compares the props and level names in the code fences a consumer copies.
      - name: Documented snippets
        run: pnpm check:doc-snippets

      # The agent-facing skills tree (#206). `intent validate` parses every
      # SKILL.md's frontmatter and enforces the schema an agent relies on; a
      # malformed skill is a silent one, since a loading agent just skips it.
      - name: Intent skills
        run: pnpm check:skills

      # Ratchet: fails if the count of undocumented components rises.
      - name: Documented components
        run: pnpm check:component-docs

      # Reads source, not `storybook-static`, which is why it is here and not
      # beside `check:story-conventions` in `visual`: whether a page documents
      # itself is a property of the TSX, so it needs no build and no browser.
      # A ratchet — see CEILING in the script.
      - name: Story Documentation
        run: pnpm check:story-docs

      # Ratchet, per clause: refs, displayName, recipe composition, prop
      # spreading. Clause 1 is what #162-#166 wait on.
      - name: Component contract
        run: pnpm check:component-contract

      # Default-deny: every shipped package, and the licence it had last time.
      - name: Shipped licences
        run: pnpm check:licences

      # The licence gate reads `package.json`; this reads the tree. The Book of
      # Shapes artwork is not a package, carries no licence, and a `.gitignore`
      # rule is advice to `git add` rather than a property of the repository.
      - name: Reference Material
        run: pnpm check:reference-material

      # The one ESLint pass. Errors — a colour literal, a class that names
      # nothing — fail it outright, which is `pnpm lint`'s verdict; warnings
      # fail it per rule when a count rises (see #58 for why they are not
      # errors). `pnpm lint` used to be a second step, and a second full pass
      # over `src/` with the same config: ~25s spent reading the other severity
      # out of an identical run.
      - name: Lint
        run: pnpm check:lint-budget

      # Ratchet: fails if styling moves back into a stylesheet.
      - name: CSS Surface
        run: pnpm check:css

      # A ratchet at zero. The generator has referenced this command since the
      # compat aliases were written; it did not exist until 0.5.0, so the exit
      # condition for deleting them was unmeasurable. Now a new hue-named call
      # site fails the build with the role it should have used.
      - name: Hue-named call sites
        run: pnpm check:tokens

      # Slot coverage and the committed fixture diff — the two gates ADR 0001
      # says a fan-out map requires, because a wrong map emits confidently: a
      # terminal renders an unfilled slot as the foreground rather than erroring.
      - name: Terminal schemes
        run: pnpm ansi:check

      # Self-hosted fonts ship as @font-face rules nothing is obliged to
      # reference. This fails if a --ds-font-* stack cannot name a family the
      # installed @fontsource packages declare — the failure mode that otherwise
      # surfaces only as "nearly every visual baseline moved".
      - name: Font Reachability
        run: pnpm check:fonts

      # knip finds unused/unlisted packages; check-deps.mjs requires each one to
      # have a stated reason, sit in the matching section, and — for CSS — be
      # reachable through the exports map.
      - name: Dependencies
        run: pnpm check:deps

      # Last, because it audits everything above it: that every action is pinned
      # to a SHA, every job has a ceiling, every gate in package.json is wired
      # into a workflow, the rosters in `docs/ci.md` and rule 6 match what this
      # file runs, and a `rule N` citation resolves to the same rule in both
      # AGENTS.md and docs/workflow.md. Rule 14 was violated at 24 of 25 sites
      # when this was written; nothing had ever looked.
      - name: Governance
        run: pnpm check:governance

  unit:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every `pnpm` step below is this package's. The workspace root holds
        # only the lockfile, the workflows and `vercel.json`; the gates, the
        # build and the suites all live in `packages/design-system`, and setting
        # this once per job keeps each step reading exactly as it did when the
        # package was the repository.
        working-directory: packages/design-system
    # ~35s: tsc, the Vitest suite, and a tsup build.
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type Check
        run: pnpm typecheck

      # Stays before `Build Package`, and the order is load-bearing rather than
      # incidental: `src/package-shape.test.ts` asserts on what `files` declares
      # while `dist/` does not yet exist. Running it after a build would change
      # what it is testing.
      - name: Unit Tests and Coverage
        run: pnpm test:coverage

      - name: Build Package
        run: pnpm build

      # Reads dist/ and src/theme.css, so it belongs in this job, after the build.
      # Fails if output size exceeds the raw or gzip byte budgets.
      - name: Bundle Size Budget
        run: pnpm check:bundle-size

      # The other half of the weight. `check:bundle-size` weighs what this
      # package authors; `tsup` externalises every runtime dependency, so what
      # a consumer actually installs is this plus ~100 KB gzip that no gate
      # could see. Reads dist/ for the import surface, so it belongs here.
      - name: Dependency Cost
        run: pnpm check:dep-cost

      # Reads dist/index.d.ts, so it belongs in this job, after the build.
      # Fails if the published type surface moved without api/index.d.ts being
      # updated — the diff in that file *is* the API change under review.
      - name: Public API Surface
        run: pnpm check:api

      # The second package. It builds against the first one's `dist/`, so it
      # runs after `Build Package` and inside its own directory — the job's
      # default is the design system's.
      #
      # `verify:report-cli` is the one that matters: it packs both packages,
      # installs them into a throwaway project and drives the CLI as a consumer
      # would. A generator that works in the workspace and not from a tarball
      # is a generator nobody else can run.
      - name: Report Generator
        working-directory: packages/design-system-report
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:report-cli

      # Per-test and per-file timings, one level below the step — see
      # `scripts/ci-telemetry.mjs`. Not a gate: it exits 0 on a missing report,
      # and `continue-on-error` covers the rest, because telemetry that can turn
      # a build red is telemetry that gets deleted. On failure too, since a
      # slow or flaky test is most worth seeing on the run it broke.
      - name: Telemetry
        if: success() || failure()
        continue-on-error: true
        run: >-
          node scripts/ci-telemetry.mjs tests
          --vitest unit=telemetry/vitest.json

      - name: Upload Telemetry
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-telemetry-${{ github.job }}
          path: packages/design-system/telemetry/
          retention-days: 30

  visual:
    name: visual
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every `pnpm` step below is this package's. The workspace root holds
        # only the lockfile, the workflows and `vercel.json`; the gates, the
        # build and the suites all live in `packages/design-system`, and setting
        # this once per job keeps each step reading exactly as it did when the
        # package was the repository.
        working-directory: packages/design-system
    # The only job here that installs a browser, so the only one that has to
    # clear `install-playwright`'s retry budget: two 8-minute attempts plus
    # ~1.5 minutes of everything else is 18. Sized above that for the same
    # reason ci.yml's single job was — a job cap firing mid-retry reports
    # `cancelled` and names no step, which is the failure rule 9 exists for.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A verdict is a function of its inputs, so a pull request whose inputs
      # already passed skips the work of re-deriving it: the Storybook build,
      # the three index gates and both browser suites, ~5 minutes. The key is
      # `scripts/render-inputs.mjs` — every tracked file, default-deny, minus
      # prose and scripts this job neither runs nor imports. Twenty of the last
      # hundred merged PRs touched none of it.
      #
      # Only pull requests look the verdict up. A push to `main` always runs in
      # full, with the full a11y matrix, and records the verdict it reached —
      # so `main` is where a wrong exclusion in that script would surface, one
      # run after merge, and it is also what every pull request can reuse.
      # Node is on the runner before `setup`, and this needs nothing else.
      - name: Rendering Inputs
        id: inputs
        # The runner image is an input no tracked file records: a new
        # `ubuntu-latest` can change fonts or rendering libraries, and under
        # `maxDiffPixels: 0` that is a different verdict. `ImageOS` and
        # `ImageVersion` are set on every hosted runner.
        # Fail closed. A bare `$(...)` inside `echo` swallows a failing script and
        # yields a key ending in `-` with no hash: one constant key that every
        # later pull request would match, skipping the job on a verdict nothing
        # earned. So the hash is taken on its own line under `set -e`, checked for
        # shape, and only then written. The image variables must be non-empty
        # for the same reason.
        run: |
          set -euo pipefail
          : "${ImageOS:?}" "${ImageVersion:?}"
          inputs="$(node scripts/render-inputs.mjs)"
          if ! [[ "${inputs}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::render-inputs.mjs printed '${inputs}', not a hash. Refusing to key a verdict on it."
            exit 1
          fi
          echo "key=visual-verdict-${ImageOS}-${ImageVersion}-${inputs}" >> "$GITHUB_OUTPUT"

      - name: Previous Verdict
        id: verdict
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/design-system/telemetry/verdict
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true

      - name: Verdict Reused
        if: steps.verdict.outputs.cache-hit == 'true'
        run: |
          {
            echo "## Visual verdict reused"
            echo ""
            echo "These rendering inputs already passed \`visual\` (key \`${{ steps.inputs.outputs.key }}\`)."
            echo "Nothing this job reads changed, so the build and both browser suites were skipped."
            echo "\`node scripts/render-inputs.mjs --list\` shows what the key leaves out."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup
        if: steps.verdict.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - name: Cache Storybook
        if: steps.verdict.outputs.cache-hit != 'true'
        id: storybook-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/design-system/storybook-static
            packages/design-system/node_modules/.cache/storybook
          # Two separate `hashFiles` calls, so the lockfile hash is a shared
          # prefix: GitHub matches `restore-keys` against the start of saved
          # keys only. One combined hash over lock-and-source would put the
          # lockfile-only restore key nowhere any saved key begins with, so
          # every source-changing PR would restore nothing and upload a fresh
          # full cache — the cost this step exists to avoid.
          key: storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/design-system/src/**', 'packages/design-system/.storybook/**', 'packages/design-system/package.json') }}
          restore-keys: |
            storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # No `pnpm build` first: Storybook compiles from `src/`, not from `dist/`,
      # so this job does not depend on the package build and can run beside it.
      - name: Build Storybook
        if: steps.verdict.outputs.cache-hit != 'true'
        run: pnpm build-storybook

      # Reads storybook-static/index.json, so it has to follow the build. Fails
      # if a story lands without being asserted or explicitly excluded.
      - name: Visual Coverage
        if: steps.verdict.outputs.cache-hit != 'true'
        run: pnpm check:visual-coverage

      # Same build, same index.json: does every documented component publish its
      # props, or carry a stated reason not to. An empty table errors nowhere.
      - name: Docgen Props
        if: steps.verdict.outputs.cache-hit != 'true'
        run: pnpm check:docgen-props

      # Title vocabulary, one-level-deep titles, and an autodocs decision per
      # component. A retitled story orphans its committed baseline.
      - name: Story Conventions
        if: steps.verdict.outputs.cache-hit != 'true'
        run: pnpm check:story-conventions

      - name: Install Playwright Browsers
        if: steps.verdict.outputs.cache-hit != 'true'
        id: playwright
        uses: ./.github/actions/install-playwright

      # Each suite names its own JSON report: they share one config, and a
      # fixed path would keep only whichever ran second.
      - name: Run Visual Regression Tests
        if: steps.verdict.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: telemetry/visual.json
        run: pnpm test:visual

      # axe over every asserted story, on both Levels. Shares the visual job
      # because it needs the same Storybook build and the same browser install,
      # and building either twice is the longest thing in CI.
      # On a pull request the narrow viewport scans only the components the
      # visual suite asserts there; on `main` it scans everything, which is
      # what keeps that scope honest. See `scannedIn` in `tests/a11y.spec.ts`.
      - name: Run Accessibility Tests
        if: steps.verdict.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: telemetry/a11y.json
          A11Y_FULL_MATRIX: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: pnpm test:a11y

      # Reached only when everything above passed, so the marker means exactly
      # that. Its content is the commit, for anyone asking where it came from.
      - name: Record Verdict
        if: steps.verdict.outputs.cache-hit != 'true'
        run: mkdir -p telemetry/verdict && echo "${GITHUB_SHA}" > telemetry/verdict/sha

      - name: Save Verdict
        if: steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/design-system/telemetry/verdict
          key: ${{ steps.inputs.outputs.key }}

      # Per-test and per-file timings, one level below the step — see
      # `scripts/ci-telemetry.mjs`. Not a gate: it exits 0 on a missing report,
      # and `continue-on-error` covers the rest, because telemetry that can turn
      # a build red is telemetry that gets deleted. On failure too, since a
      # slow or flaky test is most worth seeing on the run it broke.
      - name: Telemetry
        if: (success() || failure()) && steps.verdict.outputs.cache-hit != 'true'
        continue-on-error: true
        run: >-
          node scripts/ci-telemetry.mjs tests
          --playwright visual=telemetry/visual.json
          --playwright a11y=telemetry/a11y.json
          --cache storybook=${{ steps.storybook-cache.outputs.cache-hit }}
          --cache playwright=${{ steps.playwright.outputs.cache-hit }}

      - name: Upload Telemetry
        if: (success() || failure()) && steps.verdict.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-telemetry-${{ github.job }}
          path: packages/design-system/telemetry/
          retention-days: 30

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: packages/design-system/playwright-report/
          retention-days: 7

      - name: Upload Generated Snapshots Artifact
        # Not `always()`, per rule 9: that fires on cancellation too, and this
        # workflow cancels its own in-flight runs by design (`concurrency`
        # above), so the artifact would be uploaded from runs nobody is looking
        # at — and the moment this step gains `if-no-files-found: error`, every
        # superseded run reports a failing step. `storybook-walkthrough.yml`
        # already had the correct condition; this one did not.
        if: (success() || failure()) && steps.verdict.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-snapshots
          path: packages/design-system/tests/__snapshots__/
          retention-days: 7

  # One check that stands or falls with all three jobs above.
  #
  # `ci` is the string branch protection matches on, and it is deliberately
  # content-free. The previous name listed what CI did — "Build, Typecheck,
  # Storybook & Visual Regression" — with a comment here saying not to rename
  # it. That did not survive contact: splitting the single job into three added
  # "Unit Tests" to the middle of the name, and the required check in
  # `shared-utilities`' governance map went on naming a job that no longer
  # reported. Every PR then failed `repo-governance verify-pr-checks` on a
  # missing check while all seven checks were green.
  #
  # A name that describes the work has to change when the work changes, so it
  # cannot also be a stable contract. This one names nothing, so jobs above can
  # be split, renamed or added to without touching repository settings or the
  # governance map again.
  verify:
    name: ci
    runs-on: ubuntu-latest
    needs: [gates, unit, visual]
    # `always()`, so this reports a verdict when a job fails rather than being
    # skipped — a skipped required check is indistinguishable from one still
    # running, and blocks the PR either way.
    if: always()
    # Reads three strings and exits. A ceiling anyway, per rule 9: "every job",
    # including the ones that obviously cannot hang.
    timeout-minutes: 5

    steps:
      - name: Report the verdict of every job
        env:
          GATES: ${{ needs.gates.result }}
          UNIT: ${{ needs.unit.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          set -uo pipefail
          failed=0
          for job in GATES UNIT VISUAL; do
            result="${!job}"
            if [ "${result}" = "success" ]; then
              echo "✅ ${job}: ${result}"
            else
              echo "::error::${job} did not succeed (${result})"
              failed=1
            fi
          done
          exit "${failed}"
