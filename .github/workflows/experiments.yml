name: Testing Experiments

# Long-running measurements, kept out of the required checks.
#
# Nothing here gates a merge. Each job answers one question about the test
# suite (how many mutants survive it, what a long property campaign finds) and
# uploads its evidence. These jobs are slow and their verdicts are numbers
# rather than pass or fail, so they run on request rather than on every push.
#
# Two ways to ask:
#
# - `workflow_dispatch`, once this file is on the default branch.
# - A label on a pull request: adding `experiment:mutation` (or
#   `experiment:properties`) runs that job
#   once, and while the label stays on, every push re-runs it. Remove the
#   label to stop paying for it.
on:
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Override the files Stryker mutates (a glob); empty keeps stryker.config.mjs'
        type: string
        default: ''
      seed:
        description: 'fast-check seed under Stryker; empty keeps the pinned default'
        type: string
        default: ''
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    # Same trigger rules as the property campaign below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'experiment:mutation') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'experiment:mutation'))
    concurrency:
      group: experiments-mutation-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    # 7–9 minutes for the three modules in stryker.config.mjs (#445).
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Mutation Testing
        env:
          MUTATE: ${{ inputs.mutate }}
          FC_SEED: ${{ inputs.seed }}
        run: |
          [ -n "$FC_SEED" ] || unset FC_SEED
          if [ -n "$MUTATE" ]; then
            pnpm test:mutation --mutate "$MUTATE"
          else
            pnpm test:mutation
          fi

      - name: Upload Mutation Report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: packages/design-system/reports/mutation/
          retention-days: 30

  properties:
    name: property campaign
    # Every model-based file at a run count the unit job cannot afford. A
    # failure prints the shrunk command sequence and the seed.
    # On a pull request: when the label is added, or on a push while it is on.
    # Adding some other label must not start this one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'experiment:properties') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'experiment:properties'))
    # Per job, not per workflow: a workflow-level group would let a run whose
    # jobs are all skipped cancel a campaign still in progress.
    concurrency:
      group: experiments-properties-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    # About a minute at 1000 runs; the ceiling leaves room for more models.
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Property Campaign
        env:
          FC_NUM_RUNS: '1000'
        run: pnpm exec vitest run 'src/**/*.model.test.tsx' --reporter=verbose
