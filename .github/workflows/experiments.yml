name: Testing Experiments

# Long-running measurements, kept out of the required checks.
#
# Nothing here gates a merge. Each job answers one question about the test
# suite (how many mutants survive it, what a long property campaign finds) and
# uploads its evidence. These jobs are slow and their verdicts are numbers
# rather than pass or fail, so they run on request rather than on every push.
#
# Two ways to ask:
#
# - `workflow_dispatch`, once this file is on the default branch.
# - A label on a pull request: adding `experiment:mutation` (or
#   `experiment:properties`, or `experiment:cross-browser`) runs that job
#   once, and while the label stays on, every push re-runs it. Remove the
#   label to stop paying for it.
on:
  workflow_dispatch:
    inputs:
      mutate:
        description: 'Override the files Stryker mutates (a glob); empty keeps stryker.config.mjs'
        type: string
        default: ''
      seed:
        description: 'fast-check seed under Stryker; empty keeps the pinned default'
        type: string
        default: ''
  pull_request:
    types: [labeled, synchronize]
  # PROBE ONLY — never merged: one measurement run on a throwaway branch.
  push:
    branches: [ccr-e4c0c87c-ozlyto-cross-browser-probe]

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    # Same trigger rules as the property campaign below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'experiment:mutation') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'experiment:mutation'))
    concurrency:
      group: experiments-mutation-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    # 7–9 minutes for the three modules in stryker.config.mjs (#445).
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Mutation Testing
        env:
          MUTATE: ${{ inputs.mutate }}
          FC_SEED: ${{ inputs.seed }}
        run: |
          [ -n "$FC_SEED" ] || unset FC_SEED
          if [ -n "$MUTATE" ]; then
            pnpm test:mutation --mutate "$MUTATE"
          else
            pnpm test:mutation
          fi

      - name: Upload Mutation Report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Per attempt: a re-run of the same commit is how its noise is measured,
          # and a second upload under one name in one run is rejected.
          name: mutation-report-${{ github.run_attempt }}
          path: packages/design-system/reports/mutation/
          retention-days: 30

  properties:
    name: property campaign
    # Every model-based file at a run count the unit job cannot afford. A
    # failure prints the shrunk command sequence and the seed. The verbose
    # reporter lists each file, so a filter matching nothing is visible.
    # On a pull request: when the label is added, or on a push while it is on.
    # Adding some other label must not start this one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'experiment:properties') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'experiment:properties'))
    # Per job, not per workflow: a workflow-level group would let a run whose
    # jobs are all skipped cancel a campaign still in progress.
    concurrency:
      group: experiments-properties-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    # About a minute at 1000 runs; the ceiling leaves room for more models.
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Property Campaign
        env:
          FC_NUM_RUNS: '1000'
        # Positional filters are substrings of the path, not globs.
        run: pnpm exec vitest run model.test --reporter=verbose

  cross-browser:
    name: cross-browser
    # Firefox and WebKit over `playwright.cross-browser.config.ts`: the a11y
    # suite at one Level and one viewport, plus `tests/overlays.spec.ts` (Base
    # UI focus through dialogs, popovers, menus, select, tooltip) with Chromium
    # as its reference. No screenshots, so no baselines to keep per engine.
    # Same trigger rules as the jobs above.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.action == 'labeled' && github.event.label.name == 'experiment:cross-browser') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'experiment:cross-browser'))
    concurrency:
      group: experiments-cross-browser-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # The pinned image `ci.yml`'s `visual` job renders in. It ships Firefox and
    # WebKit beside Chromium, so nothing is installed (rule 9).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
        working-directory: packages/design-system
    # One job for both engines rather than a matrix leg each: the fixed cost
    # (image pull, install, Storybook build) is paid once, and the suite is
    # wait-bound, so four workers keep the runner busy across both projects.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Root over a runner-owned checkout; see the same step in `ci.yml`.
      - name: Trust the Workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup
        uses: ./.github/actions/setup

      # Read-only: the cache `ci.yml`'s `visual` job writes, by the same key.
      # A restore makes the build incremental; this job never saves its own.
      - name: Restore Storybook
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/design-system/storybook-static
            packages/design-system/node_modules/.cache/storybook
          key: storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/design-system/src/**', 'packages/design-system/.storybook/**', 'packages/design-system/package.json') }}
          restore-keys: |
            storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run Cross-Browser Tests
        env:
          HOME: /root
          PLAYWRIGHT_JSON_OUTPUT_FILE: telemetry/cross-browser.json
        run: pnpm test:cross-browser

      # Not a gate: see the same step in `ci.yml`.
      - name: Telemetry
        if: success() || failure()
        continue-on-error: true
        run: node scripts/ci-telemetry.mjs tests --playwright cross-browser=telemetry/cross-browser.json

      - name: Upload Cross-Browser Report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-browser-report-${{ github.run_attempt }}
          path: |
            packages/design-system/cross-browser-report/
            packages/design-system/telemetry/
          retention-days: 14

  cross-browser-split:
    name: cross-browser-split-${{ matrix.project }}
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    # Firefox and WebKit over `playwright.cross-browser.config.ts`: the a11y
    # suite at one Level and one viewport, plus `tests/overlays.spec.ts` (Base
    # UI focus through dialogs, popovers, menus, select, tooltip) with Chromium
    # as its reference. No screenshots, so no baselines to keep per engine.
    # Same trigger rules as the jobs above.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      (github.event.action == 'labeled' && github.event.label.name == 'experiment:cross-browser') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'experiment:cross-browser'))
    concurrency:
      group: experiments-cross-browser-split-${{ matrix.project }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # The pinned image `ci.yml`'s `visual` job renders in. It ships Firefox and
    # WebKit beside Chromium, so nothing is installed (rule 9).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
        working-directory: packages/design-system
    # One job for both engines rather than a matrix leg each: the fixed cost
    # (image pull, install, Storybook build) is paid once, and the suite is
    # wait-bound, so four workers keep the runner busy across both projects.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Root over a runner-owned checkout; see the same step in `ci.yml`.
      - name: Trust the Workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup
        uses: ./.github/actions/setup

      # Read-only: the cache `ci.yml`'s `visual` job writes, by the same key.
      # A restore makes the build incremental; this job never saves its own.
      - name: Restore Storybook
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/design-system/storybook-static
            packages/design-system/node_modules/.cache/storybook
          key: storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/design-system/src/**', 'packages/design-system/.storybook/**', 'packages/design-system/package.json') }}
          restore-keys: |
            storybook-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run Cross-Browser Tests
        env:
          HOME: /root
          PLAYWRIGHT_JSON_OUTPUT_FILE: telemetry/cross-browser.json
        run: pnpm test:cross-browser --project=${{ matrix.project }}

      # Not a gate: see the same step in `ci.yml`.
      - name: Telemetry
        if: success() || failure()
        continue-on-error: true
        run: node scripts/ci-telemetry.mjs tests --playwright cross-browser=telemetry/cross-browser.json

      - name: Upload Cross-Browser Report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-browser-split-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            packages/design-system/cross-browser-report/
            packages/design-system/telemetry/
          retention-days: 14
