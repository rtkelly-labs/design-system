name: Update Visual Regression Snapshots

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for updating visual snapshots'
        required: true
        default: 'Update component baseline snapshots'

jobs:
  update-snapshots:
    name: Update Snapshots on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78d470a0d99e2e94e9b60d77f8045952f4 # v3.0.0
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook Static
        run: pnpm build-storybook

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Visual Snapshots
        run: pnpm test:visual:update

      # Commit straight back to the branch this run was dispatched on — the
      # repo blocks Actions from creating pull requests, so the previous
      # peter-evans/create-pull-request approach can never work here.
      - name: Commit & push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain tests/__snapshots__)" ]; then
            echo "Snapshots already match — nothing to commit."
            exit 0
          fi
          git add tests/__snapshots__
          git commit -m "chore(visual): update Playwright baseline visual snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Snapshot Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-snapshots
          path: tests/__snapshots__/
          retention-days: 7
